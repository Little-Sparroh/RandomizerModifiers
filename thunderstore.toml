[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "RandomizerModifiers"
description = "Re-enables the disabled Split Personality and Butter Fingers mission modifiers (randomize employee and weapons on revive)."
websiteUrl = "https://github.com/Little-Sparroh/RandomizerModifiers"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/RandomizerModifiers.dll"
target = "BepInEx/plugins/RandomizerModifiers.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]

[publish.categories]
mycopunk = ["client"]
